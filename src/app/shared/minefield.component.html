<table class="minefield-board">
  <tbody>
    <tr *ngFor="let row of rows; let x = index">
      <td *ngFor="let cell of row; let y = index">
        <button
          type="button"
          [ngClass]="['cell-button', getAppearance(x, y)]"
          (click)="cellClick.emit({ x, y })"
          (contextmenu)="onContextMenu($event, x, y)"
        >
          <span class="cell-value">{{ getCellValue(x, y) || ' ' }}</span>
        </button>
      </td>
    </tr>
  </tbody>
</table>
