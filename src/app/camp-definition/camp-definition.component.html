<form #devForm="ngForm">
  <label class="field-label">Campo minado</label>

  <div class="dimension-fields">
    <label class="field-group">
      <span>Linhas</span>
      <input class="size-input" type="number" name="x" id="x" [(ngModel)]="definition.x" />
    </label>

    <label class="field-group">
      <span>Colunas</span>
      <input class="size-input" type="number" name="y" id="y" [(ngModel)]="definition.y" />
    </label>
  </div>

  <button class="action-button primary" type="button" (click)="createCamp()">Criar campo jogável</button>

  <table>
    <tbody>
      <tr *ngFor="let row of definition.camp; let x = index">
        <td *ngFor="let col of row; let y = index">
          <button (click)="definition.changeBomb(x, y)" [ngClass]="getButtonClasses(x, y)">
            <span class="cell-value">{{ htmlDisplay(x, y) }}</span>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="helper-text">
    Clique em cada célula para alternar entre vazia e mina.
    O campo será usado como base para o jogo.
  </p>

</form>
