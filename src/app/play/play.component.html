<ng-container *ngIf="definition as camp">
  <h1
    class="status-title"
    [class.status-win]="gameWon"
    [class.status-loss]="gameOver"
  >
    {{ statusTitle }}
  </h1>

  <div class="board-wrap">
    <app-minefield
      [rows]="camp.camp"
      [getCellValue]="getCellValue.bind(this)"
      [getAppearance]="getCellAppearance.bind(this)"
      (cellClick)="reveal($event.x, $event.y)"
      (cellContextMenu)="onCellContextMenu($event.event, $event.position.x, $event.position.y)"
    ></app-minefield>
  </div>

  <p class="helper-text">
    Clique para revelar. Use o botão direito para marcar bandeira ou dúvida.
  </p>

  <p>Tempo: {{ elapsedTimeLabel }}</p>
  <p>Bandeiras: {{ flaggedCells }} / {{ totalBombs }}</p>
  <div class="actions">
    <button class="action-button primary" type="button" (click)="reset()">Reiniciar</button>
    <button class="action-button secondary" type="button" (click)="backToDefinition()">Voltar à definição</button>
  </div>
</ng-container>
